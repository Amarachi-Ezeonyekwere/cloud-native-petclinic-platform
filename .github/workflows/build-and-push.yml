name: Build, Scan, and Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 424683028425.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw -B clean package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: '**/target/*.jar'
          retention-days: 1

  build-scan-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: admin-server, port: 9090 }
          - { name: api-gateway, port: 8080 }
          - { name: config-server, port: 8888 }
          - { name: customers-service, port: 8081 }
          - { name: discovery-server, port: 8761 }
          - { name: vets-service, port: 8083 }
          - { name: visits-service, port: 8082 }
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts

      - name: Reassemble target directories
        run: |
          find . -name "*.jar" -path "*/target/*" | while read jar; do
            echo "Found: $jar"
          done

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -f docker/Dockerfile \
            --build-arg ARTIFACT_NAME=spring-petclinic-${{ matrix.service.name }}-4.0.1 \
            --build-arg EXPOSED_PORT=${{ matrix.service.port }} \
            -t ${{ env.ECR_REGISTRY }}/petclinic-${{ matrix.service.name }}:${{ github.sha }} \
            --load \
            ./spring-petclinic-${{ matrix.service.name }}/target

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/petclinic-${{ matrix.service.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/petclinic-${{ matrix.service.name }}:${{ github.sha }}

  update-gitops:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout petclinic-gitops
        uses: actions/checkout@v4
        with:
          repository: Amarachi-Ezeonyekwere/petclinic-gitops
          token: ${{ secrets.GITOPS_REPO_PAT }}
          path: petclinic-gitops

      - name: Update image tags in values.yaml
        run: |
          cd petclinic-gitops
          sed -i "s/tag: \".*\"/tag: \"${{ github.sha }}\"/" helm/petclinic/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/petclinic/values.yaml
          git commit -m "chore: update image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push